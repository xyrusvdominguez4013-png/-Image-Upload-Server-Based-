# Apache2 + mod_wsgi virtual host for the Image Storage Demo.
#
# Install:
#   sudo cp deployment/apache/image-storage-demo.conf /etc/apache2/sites-available/
#   sudo a2ensite image-storage-demo
#   sudo a2enmod wsgi
#   sudo systemctl reload apache2
#
# Adjust ServerName, paths, and the Python version in WSGIDaemonProcess
# python-home to match your install (see docs/INSTALLATION.md).

<VirtualHost *:80>
    ServerName image-storage-demo.local
    ServerAdmin webmaster@localhost

    WSGIDaemonProcess image_storage_demo \
        python-home=/var/www/image-storage-demo/venv \
        python-path=/var/www/image-storage-demo \
        processes=2 threads=4

    WSGIProcessGroup image_storage_demo
    WSGIScriptAlias / /var/www/image-storage-demo/deployment/apache/image-storage-demo.wsgi

    # Serve static assets directly via Apache instead of through Flask.
    Alias /static /var/www/image-storage-demo/app/static
    <Directory /var/www/image-storage-demo/app/static>
        Require all granted
    </Directory>

    <Directory /var/www/image-storage-demo/deployment/apache>
        <Files image-storage-demo.wsgi>
            Require all granted
        </Files>
    </Directory>

    # Uploaded files are never served directly by Apache -- they are
    # streamed through Flask's /image/filesystem/<id> route so retrieval
    # timing can be recorded and access can be validated per request.
    <Directory /var/www/image-storage-demo/uploads>
        Require all denied
    </Directory>

    LimitRequestBody 10485760

    ErrorLog ${APACHE_LOG_DIR}/image-storage-demo-error.log
    CustomLog ${APACHE_LOG_DIR}/image-storage-demo-access.log combined
</VirtualHost>
